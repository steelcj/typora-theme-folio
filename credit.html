<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body {
    font-family: 'EB Garamond', Georgia, 'Times New Roman', serif;
    font-size: 13px;
    color: #444444;
    background: #faf8f3;
    margin: 0;
    padding: 12px 16px;
    line-height: 1.6;
}
a { color: #222222; text-decoration: none; border-bottom: 1px solid #cccccc; }
a:hover { border-bottom-color: #222222; }
.name {
    font-family: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #111111;
    margin-bottom: 2px;
}
.sub {
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #777777;
    margin-bottom: 10px;
    font-family: 'Cinzel', serif;
}
.rule { border: none; border-top: 1px solid #d8d3c8; margin: 8px 0; }
.muted { color: #888888; font-size: 10px; }
</style>
</head>
<body>
<p class="name">Folio</p>
<p class="sub">UniversalCake Theme</p>
<hr class="rule">
<p>
    Theme by <a href="https://universalcake.ca">Christopher Steel</a>.<br>
    Parchment card · Cinzel · EB Garamond.<br>
    Display: <a href="https://fonts.google.com/specimen/Cinzel">Cinzel</a>
    (Natanael Gama, SIL OFL 1.1).<br>
    Body: <a href="https://fonts.google.com/specimen/EB+Garamond">EB Garamond</a>
    (Georg Duffner &amp; Octavio Pardo, SIL OFL 1.1).
</p>
<p class="muted">CC BY 4.0 · Copyright 2026 Christopher Steel / UniversalCake</p>
</body>
</html>
